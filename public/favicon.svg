<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Soft background circle -->
  <circle cx="32" cy="32" r="30" fill="#FFE8E8" />
  
  <!-- Car drop shadow -->
  <ellipse cx="32" cy="50" rx="22" ry="4" fill="#000000" opacity="0.15" />

  <!-- Rear spoiler -->
  <path d="M12 28 L14 22 L20 22 L17 28 Z" fill="#B71C1C" />
  <rect x="10" y="20" width="10" height="3" rx="1.5" fill="#E53935" />

  <!-- Main Car Body -->
  <path d="M14 42 C13 36, 17 31, 24 30 L30 23 C33 19, 44 19, 48 24 L53 30 C58 31, 60 35, 59 41 C59 44, 56 45, 51 45 L18 45 C15 45, 14 44, 14 42 Z" fill="#E53935" />

  <!-- Roof & Hood highlight -->
  <path d="M31 23 C34 20, 43 20, 46 24 L50 29 L26 29 Z" fill="#C62828" />

  <!-- Windshield / Eyes Screen -->
  <path d="M32 24 C34 21.5, 43 21.5, 45 24.5 L48 29 L29 29 Z" fill="#FFFFFF" stroke="#D32F2F" stroke-width="0.75" />
  
  <!-- Cartoon Eyes -->
  <!-- Left Eye -->
  <ellipse cx="36" cy="26" rx="2.5" ry="3" fill="#1E88E5" />
  <circle cx="36.5" cy="26" r="1.5" fill="#111111" />
  <circle cx="35.5" cy="25" r="0.8" fill="#FFFFFF" />
  
  <!-- Right Eye -->
  <ellipse cx="42" cy="26" rx="2.5" ry="3" fill="#1E88E5" />
  <circle cx="42.5" cy="26" r="1.5" fill="#111111" />
  <circle cx="41.5" cy="25" r="0.8" fill="#FFFFFF" />

  <!-- Eye lids / Friendly brow -->
  <path d="M33 23 Q36 22 39 23" stroke="#B71C1C" stroke-width="1" stroke-linecap="round" fill="none" />
  <path d="M40 23 Q43 22 45 23" stroke="#B71C1C" stroke-width="1" stroke-linecap="round" fill="none" />

  <!-- Lightning Bolt #95 Graphic -->
  <polygon points="30,37 38,32 35,37 41,37 32,43 34,39" fill="#FDD835" stroke="#F57F17" stroke-width="0.5" />

  <!-- Front Grille Smile -->
  <path d="M53 38 Q56 40 57 37" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Headlight beam -->
  <ellipse cx="56" cy="34" rx="2.5" ry="2" fill="#FFF59D" />

  <!-- Wheels -->
  <!-- Rear Wheel -->
  <circle cx="21" cy="44" r="6.5" fill="#212121" />
  <circle cx="21" cy="44" r="3.5" fill="#B0BEC5" />
  <circle cx="21" cy="44" r="1.5" fill="#E53935" />

  <!-- Front Wheel -->
  <circle cx="47" cy="44" r="6.5" fill="#212121" />
  <circle cx="47" cy="44" r="3.5" fill="#B0BEC5" />
  <circle cx="47" cy="44" r="1.5" fill="#E53935" />
</svg>
